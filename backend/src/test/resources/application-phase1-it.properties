spring.datasource.url=${PHASE1_MYSQL_URL}
spring.datasource.username=${PHASE1_MYSQL_USERNAME}
spring.datasource.password=${PHASE1_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET SESSION innodb_lock_wait_timeout=3
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=true
spring.jpa.show-sql=false
jwt.secret=${PHASE1_JWT_SECRET}
jwt.expiration=86400000
file.upload-dir=${java.io.tmpdir}/crm-phase1-it-uploads
logging.level.root=WARN
logging.level.org.springframework.boot.autoconfigure=INFO
spring.devtools.restart.enabled=false
