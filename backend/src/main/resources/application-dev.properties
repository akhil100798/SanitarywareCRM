spring.datasource.url=jdbc:h2:mem:sanitaryware_crm_dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=root
spring.datasource.password=${DATABASE_PASSWORD:1607}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
jwt.secret=${JWT_SECRET:local-only-change-me-please-change-this-secret-123456}
management.health.redis.enabled=false
security.rate-limiter.store=memory
notifications.scheduler.enabled=false
