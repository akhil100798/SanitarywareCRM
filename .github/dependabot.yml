version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      spring-dependencies:
        patterns:
          - "org.springframework*"
          - "com.fasterxml.jackson*"
      jjwt:
        patterns:
          - "io.jsonwebtoken*"
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.apache.poi:poi-ooxml"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    groups:
      mobile-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/automation-tests"
    schedule:
      interval: "weekly"
    groups:
      automation-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "dotenv"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
