name: SanitarywareCRM CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-and-test:
    name: Backend Build, Unit Tests & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Backend (Maven)
        run: |
          cd backend
          mvn clean package

      - name: Archive Backend Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Archive Executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-jar
          path: backend/target/*.jar
          retention-days: 7

  frontend-build:
    name: Frontend Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

      - name: Test and Build Frontend (Vite Production)
        run: |
          cd frontend
          npm test
          npm run build
        env:
          VITE_API_BASE_URL: "https://api.crm.example.com/api"

      - name: Archive Frontend Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  e2e-and-api-verification:
    name: Automated API & E2E Verification
    needs: [backend-build-and-test, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: automation-tests/package-lock.json

      - name: Install Test Automation Dependencies
        run: |
          cd automation-tests
          npm ci
          npx playwright install --with-deps chromium

      - name: Start QA Backend Server
        run: |
          cd backend
          mvn package -DskipTests
          java -jar target/crm-backend-1.0.0.jar --spring.profiles.active=qa &
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:8081/api/health
        env:
          DATABASE_PASSWORD: ""
          JWT_SECRET: "qa-only-change-me-qa-only-change-me-256-bit-secret"

      - name: Start Frontend Server
        run: |
          cd frontend
          npm ci
          npm run dev -- --host 127.0.0.1 --port 5173 &
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5173

      - name: Run Database Tests
        run: |
          cd automation-tests
          npm run test:database

      - name: Run API Tests
        run: |
          cd automation-tests
          npm run test:api

      - name: Run Security & RBAC Tests
        run: |
          cd automation-tests
          npm run test:security

      - name: Run Bug Hunt Tests
        run: |
          cd automation-tests
          npm run test:bughunt

      - name: Seed Test Fixtures
        run: |
          cd automation-tests
          npm run seed

      - name: Run Frontend E2E Tests
        run: |
          cd automation-tests
          npm run test:frontend

      - name: Run Accessibility Smoke Tests
        run: |
          cd automation-tests
          npm run test:a11y

      - name: Archive Playwright Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automation-tests/reports/
          retention-days: 7

  mobile-verification:
    name: Mobile Lint, Unit Tests & Android Export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        run: npm ci

      - name: Run Mobile Lint
        run: npm run lint

      - name: Run Mobile Unit Tests
        run: npm test

      - name: Export Android Bundle (Hermes Bytecode)
        run: npm run export:android
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          CI: "true"

  security-and-vulnerability-scan:
    name: Security & Vulnerability Scanning (Trivy & Audits)
    runs-on: ubuntu-latest
    needs: [backend-build-and-test]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Resolve Backend Maven Dependencies from Cache
        run: |
          cd backend
          mvn -B dependency:resolve

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: NPM Security Audits
        run: |
          echo "Auditing frontend dependencies..."
          cd frontend && npm audit --audit-level=high || true
          echo "Auditing mobile dependencies..."
          cd ../mobile && npm audit --audit-level=high || true
          echo "Auditing automation-tests dependencies..."
          cd ../automation-tests && npm audit --audit-level=high || true

      - name: Run Trivy Filesystem Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          trivyignores: '.trivyignore'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'

      - name: Build Docker Images for Scanning
        run: |
          docker compose -f docker-compose.prod.yml build

      - name: Run Trivy Docker Image Scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sanitarywarecrm-backend:latest'
          scanners: 'vuln'
          trivyignores: '.trivyignore'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'

      - name: Run Trivy Docker Image Scanner (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sanitarywarecrm-frontend:latest'
          scanners: 'vuln'
          trivyignores: '.trivyignore'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
